<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Convite - Laura Cecília XV Anos</title>

<!-- ── Preview WhatsApp / Open Graph ── -->
<meta property="og:site_name" content="Convite Digital" />
<meta property="og:title" content="🗝️ Laura Cecília — XV Anos" />
<meta property="og:description" content="Você recebeu um convite especial. Toque para abrir." />
<meta property="og:image" content="https://convidadigital.github.io/lauraxvanos/preview.jpg" />
<meta property="og:image:width" content="1280" />
<meta property="og:image:height" content="720" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="🗝️ Laura Cecília — XV Anos" />
<meta name="twitter:description" content="Você recebeu um convite especial. Toque para abrir." />
<meta name="twitter:image" content="https://convidadigital.github.io/lauraxvanos/preview.jpg" />

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:#0d0608;
  touch-action:none;
  -webkit-tap-highlight-color: transparent;
}

/* ── CENA ── */
#scene {
  position:fixed;
  inset:0;
}

/* Porta em tela cheia */
#porta {
  position:absolute;
  inset:0;
  background: url('porta.png') center center / cover no-repeat;
  transition: filter 1.5s ease, brightness 1.5s ease;
}
#porta.abrindo {
  filter: brightness(1.5) saturate(1.3) contrast(1.05);
}

/* Vinheta cinematográfica */
#vinheta {
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at 38% 52%,
    transparent 25%,
    rgba(0,0,0,0.4) 70%,
    rgba(0,0,0,0.7) 100%);
  pointer-events:none;
  z-index:2;
  transition: opacity 1s;
}

/* ── LUZ NA FECHADURA ── */
/* Centrada exatamente sobre a fechadura: 38% X, 52% Y */
#luz {
  position:absolute;
  left: 38%;
  top:  52%;
  transform: translate(-50%, -50%);
  width: 0; height: 0;
  border-radius:50%;
  background: radial-gradient(circle,
    rgba(255,230,150,0.95) 0%,
    rgba(212,175,55,0.5)   35%,
    rgba(180,120,40,0.2)   60%,
    transparent 75%);
  pointer-events:none;
  z-index:3;
  opacity:0;
  transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
}
#luz.ativa {
  width: 320px; height: 320px;
  opacity: 1;
}

/* ── CHAVE ── */
/*
  A chave na foto de referência está:
  - Horizontal (ornamento à direita, dentes à esquerda entrando na fechadura)
  - Posição inicial: colocamos ela no canto inferior direito da tela
  
  A imagem da chave (chave.png) está orientada em ~45° diagonal.
  Rotacionamos para ficar horizontal (-45deg) na posição inicial.
  Ao encaixar, giramos para a posição correta de encaixe.
*/
#chave-wrap {
  position: fixed;
  /* Posição inicial: canto inferior direito */
  right:  24px;
  bottom: 80px;
  left: auto;
  top:  auto;
  width: clamp(140px, 35vw, 220px);
  cursor: grab;
  touch-action: none;
  user-select: none;
  z-index: 20;
  filter:
    drop-shadow(0 0 20px rgba(212,155,80,0.6))
    drop-shadow(0 8px 28px rgba(0,0,0,0.75));
  transition: filter 0.25s;
  will-change: transform;
}
#chave-wrap:active { cursor: grabbing; }

#chave-wrap.segurando {
  filter:
    drop-shadow(0 0 32px rgba(255,210,100,0.8))
    drop-shadow(0 12px 36px rgba(0,0,0,0.85));
}

#chave-img {
  width: 100%;
  height: auto;
  display: block;
  /* Chave começa inclinada ~45° (diagonal), orientação natural da imagem */
  transform: rotate(0deg);
  transform-origin: 50% 50%;
  transition: transform 0.35s ease;
  pointer-events: none;
}

/* Perto da fechadura: endireita para posição de encaixe */
#chave-wrap.perto #chave-img {
  transform: rotate(45deg); /* ajusta para horizontal */
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
}

/* Animação de encaixe + giro cinematográfico */
#chave-wrap.encaixando {
  transition: none;
}
#chave-wrap.encaixando #chave-img {
  animation: giroChave 1.5s cubic-bezier(.4,0,.2,1) forwards;
  transform-origin: 20% 55%; /* ponto de pivô = onde o cabo entra no buraco */
}
@keyframes giroChave {
  0%   { transform: rotate(45deg)  scale(0.9); }
  15%  { transform: rotate(40deg)  scale(0.82); }
  30%  { transform: rotate(50deg)  scale(0.80); }
  55%  { transform: rotate(-30deg) scale(0.80); }  /* giro principal */
  80%  { transform: rotate(-60deg) scale(0.80); }
  100% { transform: rotate(-50deg) scale(0.80); }
}

/* ── ZONA DA FECHADURA ── */
/* 
  Porta.png é 720x1280 (portrait).
  Fechadura está em ~38% X, ~52% Y da imagem.
  Usamos % para funcionar em qualquer tela.
*/
#fechadura {
  position: absolute;
  left:   38%;
  top:    52%;
  transform: translate(-50%, -50%);
  width:  90px;
  height: 120px;
  z-index: 10;
  border-radius: 45px 45px 8px 8px;
  /* descomente para calibrar posição: border: 3px dashed red; */
}
#fechadura.sobre {
  box-shadow:
    0 0 0 3px rgba(255,215,100,0.4),
    0 0 40px rgba(255,215,100,0.3);
}

/* ── INSTRUÇÃO ── */
#instrucao {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  color: #f5e0c8;
  font-family: 'Georgia', serif;
  font-size: clamp(13px, 3.8vw, 16px);
  letter-spacing: 0.1em;
  text-shadow:
    0 2px 18px rgba(0,0,0,0.95),
    0 0 40px rgba(0,0,0,0.8);
  white-space: nowrap;
  pointer-events: none;
  z-index: 30;
  animation: piscar 2.8s ease-in-out infinite;
  transition: opacity 0.7s;
}
@keyframes piscar {
  0%,100% { opacity: 0.55; }
  50%      { opacity: 1;    }
}

/* ── FLASH ── */
#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  opacity: 0;
  background: radial-gradient(ellipse at 38% 52%,
    rgba(255,250,210,0.9) 0%,
    rgba(255,200,80,0.4)  40%,
    transparent 70%);
  transition: opacity 0.08s;
}
#flash.ativo { opacity: 1; }

/* ── PARTÍCULAS ── */
.particula {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 45;
  animation: voar var(--dur,1.4s) ease-out var(--delay,0s) both;
}
@keyframes voar {
  0%   { opacity:1; transform: translate(0,0) scale(1) rotate(0deg); }
  100% { opacity:0; transform: translate(var(--tx,0px),var(--ty,-80px)) scale(0.1) rotate(360deg); }
}

/* ── SUCESSO ── */
#sucesso {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.3rem;
  background: rgba(8,3,6,0);
  backdrop-filter: blur(0px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.4s ease, backdrop-filter 1.4s ease, background 1.4s ease;
}
#sucesso.visivel {
  opacity: 1;
  pointer-events: all;
  background: rgba(8,3,6,0.78);
  backdrop-filter: blur(12px);
}

#sucesso-titulo {
  color: #f5e0c8;
  font-family: 'Georgia', serif;
  font-size: clamp(20px, 6vw, 34px);
  letter-spacing: 0.12em;
  text-align: center;
  padding: 0 2rem;
  text-shadow:
    0 0 50px rgba(212,155,80,0.7),
    0 2px 20px rgba(0,0,0,0.8);
  line-height: 1.5;
}

.divisor {
  width: 140px;
  height: 1px;
  background: linear-gradient(to right,
    transparent, #d4af37 30%, #f5e0c8 50%, #d4af37 70%, transparent);
  opacity: 0.75;
}

#sucesso-sub {
  color: #c9a0b0;
  font-family: 'Georgia', serif;
  font-size: clamp(13px, 3.2vw, 15px);
  letter-spacing: 0.08em;
  text-align: center;
}

#btn-abrir {
  margin-top: 0.5rem;
  padding: 16px 56px;
  background: transparent;
  border: 1.5px solid rgba(212,175,55,0.85);
  border-radius: 50px;
  color: #f5e0c8;
  font-family: 'Georgia', serif;
  font-size: clamp(14px, 4vw, 18px);
  letter-spacing: 0.15em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.3s, border-color 0.3s;
}
#btn-abrir::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(212,175,55,0);
  transition: background 0.3s;
}
#btn-abrir:hover {
  border-color: #d4af37;
  box-shadow:
    0 0 35px rgba(212,175,55,0.35),
    inset 0 0 25px rgba(212,175,55,0.08);
}
#btn-abrir:hover::after {
  background: rgba(212,175,55,0.1);
}
#btn-abrir:active { transform: scale(0.97); }

#contagem {
  color: rgba(200,160,180,0.6);
  font-family: 'Georgia', serif;
  font-size: 12px;
  letter-spacing: 0.1em;
  min-height: 18px;
}
</style>
</head>
<body>
<div id="scene">
  <div id="porta"></div>
  <div id="vinheta"></div>
  <div id="luz"></div>
  <div id="flash"></div>
  <div id="fechadura"></div>

  <div id="chave-wrap">
    <img src="chave.png" id="chave-img" alt="Chave ornamental" draggable="false"/>
  </div>

  <p id="instrucao">✦ Leve a chave até a fechadura ✦</p>

  <div id="sucesso">
    <p id="sucesso-titulo">✨ A porta se abriu ✨</p>
    <div class="divisor"></div>
    <p id="sucesso-sub">Seu convite está esperando por você</p>
    <button id="btn-abrir" onclick="irParaLink()">Abrir convite</button>
    <p id="contagem"></p>
  </div>
</div>

<script>
const LINK = "https://convite-digital.com/c/lauracecilia";

const chaveWrap = document.getElementById("chave-wrap");
const chaveImg  = document.getElementById("chave-img");
const fechadura = document.getElementById("fechadura");
const instrucao = document.getElementById("instrucao");
const flash     = document.getElementById("flash");
const sucesso   = document.getElementById("sucesso");
const porta     = document.getElementById("porta");
const luz       = document.getElementById("luz");
const contagem  = document.getElementById("contagem");

let arrastando  = false;
let desbloqueado= false;
let posIniciada = false;
let dx = 0, dy = 0, startX, startY;

/* ── Fixa posição ao primeiro toque ── */
function iniciarPos() {
  if (posIniciada) return;
  const r = chaveWrap.getBoundingClientRect();
  chaveWrap.style.right  = "auto";
  chaveWrap.style.bottom = "auto";
  chaveWrap.style.left   = r.left + "px";
  chaveWrap.style.top    = r.top  + "px";
  posIniciada = true;
}

function centro(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ── Eventos ── */
chaveWrap.addEventListener("mousedown",  aoPresionar);
chaveWrap.addEventListener("touchstart", aoPresionar, { passive:false });
window.addEventListener("mousemove",  aoMover);
window.addEventListener("touchmove",  aoMover, { passive:false });
window.addEventListener("mouseup",    aoSoltar);
window.addEventListener("touchend",   aoSoltar);

function aoPresionar(e) {
  if (desbloqueado) return;
  e.preventDefault();
  iniciarPos();
  arrastando = true;
  chaveWrap.classList.add("segurando");
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX - dx;
  startY = p.clientY - dy;
}

function aoMover(e) {
  if (!arrastando) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  dx = p.clientX - startX;
  dy = p.clientY - startY;
  chaveWrap.style.transform = `translate(${dx}px,${dy}px)`;

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  /* Glow proporcional à distância */
  if (dist < 200) {
    const t = Math.max(0, 1 - dist/200);
    luz.style.opacity = (t * 0.85).toFixed(2);
    const s = Math.round(t * 280);
    luz.style.width  = s + "px";
    luz.style.height = s + "px";
  } else {
    luz.style.opacity = "0";
    luz.style.width   = "0";
    luz.style.height  = "0";
  }

  fechadura.classList.toggle("sobre", dist < 75);
  chaveWrap.classList.toggle("perto", dist < 100);
}

function aoSoltar() {
  if (!arrastando) return;
  arrastando = false;
  chaveWrap.classList.remove("segurando","perto");
  fechadura.classList.remove("sobre");

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  if (dist < 80) {
    encaixar(cf);
  } else {
    voltarChave();
    apgarLuz();
  }
}

function voltarChave() {
  chaveWrap.style.transition = "transform 0.5s cubic-bezier(.4,0,.2,1)";
  dx = 0; dy = 0;
  chaveWrap.style.transform = "translate(0,0)";
  setTimeout(() => { chaveWrap.style.transition = ""; }, 520);
}

function apgarLuz() {
  luz.style.opacity = "0";
  luz.style.width   = "0";
  luz.style.height  = "0";
}

function encaixar(cf) {
  desbloqueado = true;
  instrucao.style.opacity = "0";

  /* Snap suave para o centro da fechadura */
  const cr = chaveWrap.getBoundingClientRect();
  chaveWrap.style.transition = "left 0.45s cubic-bezier(.4,0,.2,1), top 0.45s cubic-bezier(.4,0,.2,1), transform 0.45s";
  chaveWrap.style.left = (cf.x - cr.width/2)  + "px";
  chaveWrap.style.top  = (cf.y - cr.height/2) + "px";
  chaveWrap.style.transform = "translate(0,0)";
  dx = 0; dy = 0;

  /* Luz máxima */
  luz.classList.add("ativa");

  setTimeout(() => {
    chaveWrap.style.transition = "";

    /* Inicia animação de giro */
    chaveWrap.classList.remove("perto");
    chaveWrap.classList.add("encaixando");

    /* Flash 1 — no pico do giro */
    setTimeout(() => {
      fazFlash();
      spawnarParticulas(cf, 18);
      porta.classList.add("abrindo");
    }, 900);

    /* Flash 2 — reforço */
    setTimeout(() => {
      fazFlash();
      spawnarParticulas(cf, 20);
    }, 1150);

    /* Tela de sucesso */
    setTimeout(() => {
      apgarLuz();
      sucesso.classList.add("visivel");
      iniciarContagem(5);
    }, 2200);

  }, 470);
}

function fazFlash() {
  flash.classList.add("ativo");
  setTimeout(() => flash.classList.remove("ativo"), 180);
}

function spawnarParticulas(c, qtd) {
  const cores = [
    "#d4af37","#f5c8d0","#fff3d0",
    "#e8a878","#ffd700","#f0a8b8",
    "#ffe8e1","#c9a050","#ffffff",
    "#ffcce0","#ffe4a0"
  ];
  for (let i = 0; i < qtd; i++) {
    const el  = document.createElement("div");
    el.className = "particula";
    const tam  = 3 + Math.random() * 11;
    const ang  = Math.random() * Math.PI * 2;
    const vel  = 50 + Math.random() * 130;
    const tx   = (Math.cos(ang) * vel).toFixed(1);
    const ty   = (Math.sin(ang) * vel - 50).toFixed(1);
    const dur  = (1.0 + Math.random() * 0.9).toFixed(2);
    const del  = (Math.random() * 0.3).toFixed(2);
    el.style.cssText = `
      width:${tam}px;height:${tam}px;
      background:${cores[Math.floor(Math.random()*cores.length)]};
      left:${c.x + (Math.random()-0.5)*40}px;
      top:${c.y  + (Math.random()-0.5)*30}px;
      --tx:${tx}px;--ty:${ty}px;
      --dur:${dur}s;--delay:${del}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
}

let timer;
function iniciarContagem(seg) {
  contagem.textContent = `Abrindo em ${seg}s...`;
  timer = setInterval(() => {
    seg--;
    if (seg <= 0) {
      clearInterval(timer);
      irParaLink();
    } else {
      contagem.textContent = `Abrindo em ${seg}s...`;
    }
  }, 1000);
}

function irParaLink() {
  clearInterval(timer);
  window.location.href = LINK;
}
</script>
</body>
</html>
