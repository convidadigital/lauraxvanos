<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:#0d0608;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}

#scene { position:fixed; inset:0; }

/* ── PORTA ── */
#porta {
  position:absolute; inset:0;
  background: url('porta.png') center center / cover no-repeat;
  transition: filter 2s ease;
}
#porta.abrindo { filter: brightness(1.6) saturate(1.3); }

/* Vinheta */
#vinheta {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 52%,
    transparent 20%, rgba(0,0,0,0.35) 65%, rgba(0,0,0,0.72) 100%);
  pointer-events:none; z-index:2;
}

/* ── LUZ DA FECHADURA ── */
/* Fechadura centralizada: 50% X, 52% Y */
#luz {
  position:absolute;
  left:50%; top:52%;
  transform:translate(-50%,-50%);
  width:0; height:0;
  border-radius:50%;
  background: radial-gradient(circle,
    rgba(255,235,160,1) 0%,
    rgba(212,175,55,0.6) 30%,
    rgba(180,120,40,0.25) 60%,
    transparent 75%);
  pointer-events:none; z-index:3;
  opacity:0;
  transition: width 0.35s ease, height 0.35s ease, opacity 0.35s ease;
  mix-blend-mode: screen;
}

/* ── ZONA DA FECHADURA ── */
/* 
  Porta nova 941x1672 portrait.
  Placa dourada: centro 50% X, 52% Y
  Buraco (keyhole circle): 50% X, 50% Y
  A chave entra horizontalmente pelo lado direito
*/
#fechadura {
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:85px; height:85px;
  border-radius:50%;
  z-index:10;
  /* descomente para calibrar: border:3px dashed red; */
}
#fechadura.sobre {
  box-shadow: 0 0 0 4px rgba(255,215,100,0.5),
              0 0 50px rgba(255,215,100,0.35);
}

/* ── CHAVE ── */
/*
  Na referência a chave está:
  - Horizontal: cabo entrando pela ESQUERDA na fechadura
  - Ornamento (arco decorativo) à DIREITA da fechadura
  - A chave.png está orientada ~45° diagonal (cabo embaixo-esquerda, ornamento cima-direita)
  
  Posição inicial: centro inferior da tela
  Rotação inicial: a imagem já vem diagonal, vamos deixar natural
  Ao aproximar: endireita para horizontal (rotação final ~-45deg na imagem)
  Ao encaixar: gira mais ~90° no sentido anti-horário (como girar chave real)
*/
#chave-wrap {
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  width: clamp(170px, 42vw, 260px);
  cursor:grab;
  touch-action:none;
  user-select:none;
  z-index:20;
  filter:
    drop-shadow(0 0 22px rgba(212,165,80,0.65))
    drop-shadow(0 10px 30px rgba(0,0,0,0.8));
  transition:filter 0.25s;
  will-change:transform;
}
#chave-wrap:active { cursor:grabbing; }
#chave-wrap.segurando {
  filter:
    drop-shadow(0 0 36px rgba(255,215,100,0.85))
    drop-shadow(0 14px 40px rgba(0,0,0,0.9));
}

#chave-img {
  width:100%; height:auto; display:block;
  /* Imagem natural da chave: diagonal ~45° */
  transform: rotate(0deg);
  transform-origin:50% 50%;
  pointer-events:none;
  transition: transform 0.5s cubic-bezier(.4,0,.2,1);
}

/* Perto: endireita a chave para posição horizontal de encaixe */
#chave-wrap.perto #chave-img {
  transform: rotate(45deg);
}

/* Encaixando: snap + giro de fechadura */
#chave-wrap.encaixando #chave-img {
  animation: giroFechadura 1.6s cubic-bezier(.35,0,.25,1) forwards;
  /* pivot no ponto onde o cabo entra no buraco: ~18% X, 62% Y da imagem */
  transform-origin: 18% 62%;
}
@keyframes giroFechadura {
  0%   { transform: rotate(45deg)  scale(1);    }  /* posição de encaixe */
  8%   { transform: rotate(42deg)  scale(0.88); }  /* miniatura ao entrar */
  18%  { transform: rotate(48deg)  scale(0.85); }  /* pausa antes de girar */
  45%  { transform: rotate(-25deg) scale(0.85); }  /* giro principal */
  70%  { transform: rotate(-55deg) scale(0.85); }  /* continua girando */
  88%  { transform: rotate(-62deg) scale(0.85); }  /* desacelera */
  100% { transform: rotate(-58deg) scale(0.85); }  /* posição final */
}

/* ── INSTRUÇÃO ── */
#instrucao {
  position:fixed;
  bottom:20px; left:50%;
  transform:translateX(-50%);
  color:#f5e0c8;
  font-family:'Georgia',serif;
  font-size:clamp(13px, 3.8vw, 16px);
  letter-spacing:0.1em;
  text-shadow: 0 2px 20px rgba(0,0,0,0.95), 0 0 50px rgba(0,0,0,0.8);
  white-space:nowrap;
  pointer-events:none;
  z-index:30;
  animation:piscar 2.8s ease-in-out infinite;
  transition:opacity 0.7s;
}
@keyframes piscar {
  0%,100% { opacity:0.5; }
  50%      { opacity:1; }
}

/* ── FLASH ── */
#flash {
  position:fixed; inset:0;
  pointer-events:none; z-index:40;
  opacity:0;
  background: radial-gradient(ellipse at 50% 50%,
    rgba(255,250,215,0.92) 0%,
    rgba(255,205,90,0.45) 38%,
    transparent 68%);
  transition:opacity 0.07s;
}
#flash.ativo { opacity:1; }

/* ── PARTÍCULAS ── */
.particula {
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:45;
  animation:voar var(--dur,1.4s) ease-out var(--delay,0s) both;
}
@keyframes voar {
  0%   { opacity:1; transform:translate(0,0) scale(1); }
  100% { opacity:0; transform:translate(var(--tx,0px),var(--ty,-80px)) scale(0.05); }
}

/* ── SUCESSO ── */
#sucesso {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:1.3rem;
  background:rgba(6,2,5,0);
  backdrop-filter:blur(0px);
  opacity:0; pointer-events:none;
  transition: opacity 1.5s ease, backdrop-filter 1.5s ease, background 1.5s ease;
}
#sucesso.visivel {
  opacity:1; pointer-events:all;
  background:rgba(6,2,5,0.8);
  backdrop-filter:blur(14px);
}
#sucesso-titulo {
  color:#f5e0c8;
  font-family:'Georgia',serif;
  font-size:clamp(20px,6vw,34px);
  letter-spacing:0.13em;
  text-align:center;
  padding:0 2rem;
  text-shadow: 0 0 60px rgba(212,155,80,0.8), 0 2px 20px rgba(0,0,0,0.9);
  line-height:1.5;
}
.divisor {
  width:150px; height:1px;
  background:linear-gradient(to right,
    transparent, #d4af37 25%, #f5e8c0 50%, #d4af37 75%, transparent);
  opacity:0.8;
}
#sucesso-sub {
  color:#c0a0b8;
  font-family:'Georgia',serif;
  font-size:clamp(13px,3.2vw,15px);
  letter-spacing:0.08em;
  text-align:center;
}
#btn-abrir {
  margin-top:0.5rem;
  padding:16px 56px;
  background:transparent;
  border:1.5px solid rgba(212,175,55,0.85);
  border-radius:50px;
  color:#f5e0c8;
  font-family:'Georgia',serif;
  font-size:clamp(14px,4vw,18px);
  letter-spacing:0.15em;
  cursor:pointer;
  transition:box-shadow 0.3s, border-color 0.3s, transform 0.15s;
}
#btn-abrir:hover {
  border-color:#d4af37;
  box-shadow: 0 0 40px rgba(212,175,55,0.4), inset 0 0 20px rgba(212,175,55,0.08);
}
#btn-abrir:active { transform:scale(0.96); }
#contagem {
  color:rgba(192,155,178,0.55);
  font-family:'Georgia',serif;
  font-size:12px;
  letter-spacing:0.1em;
  min-height:18px;
}
</style>
</head>

let audioCtx = null;
let somBuffer = null;

async function carregarSom() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const resp = await fetch(SOM_B64);
    const arr  = await resp.arrayBuffer();
    somBuffer  = await audioCtx.decodeAudioData(arr);
  } catch(e) { console.log("Som não carregado:", e); }
}

function tocarSom() {
  if (!audioCtx || !somBuffer) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createBufferSource();
    src.buffer = somBuffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 1.0;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(0);
  } catch(e) {}
}

const chaveWrap = document.getElementById("chave-wrap");

let arrastando   = false;
let desbloqueado = false;
let posIniciada  = false;
let dx = 0, dy = 0, startX, startY;

/* ── Fix posição ao primeiro toque ── */
function iniciarPos() {
  if (posIniciada) return;
  const r = chaveWrap.getBoundingClientRect();
  chaveWrap.style.bottom = "auto";
  chaveWrap.style.left   = r.left + "px";
  chaveWrap.style.top    = r.top  + "px";
  chaveWrap.style.transform = "none";
  posIniciada = true;
}

function centro(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ── Eventos ── */
chaveWrap.addEventListener("mousedown",  aoPresionar);
chaveWrap.addEventListener("touchstart", aoPresionar, { passive:false });
window.addEventListener("mousemove",  aoMover);
window.addEventListener("touchmove",  aoMover, { passive:false });
window.addEventListener("mouseup",    aoSoltar);
window.addEventListener("touchend",   aoSoltar);

/* Carrega som no primeiro toque (política de áudio dos browsers) */
document.addEventListener("touchstart", () => { if(!audioCtx) carregarSom(); }, { once:true });
document.addEventListener("mousedown",  () => { if(!audioCtx) carregarSom(); }, { once:true });

function aoPresionar(e) {
  if (desbloqueado) return;
  e.preventDefault();
  iniciarPos();
  if (!audioCtx) carregarSom();
  arrastando = true;
  chaveWrap.classList.add("segurando");
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX - dx;
  startY = p.clientY - dy;
}

function aoMover(e) {
  if (!arrastando) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  dx = p.clientX - startX;
  dy = p.clientY - startY;
  chaveWrap.style.transform = `translate(${dx}px,${dy}px)`;

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  /* Luz proporcional */
  if (dist < 220) {
    const t = Math.max(0, 1 - dist/220);
    luz.style.opacity = (t * 0.9).toFixed(2);
    const s = Math.round(t * 300);
    luz.style.width  = s + "px";
    luz.style.height = s + "px";
  } else {
    luz.style.opacity = "0";
    luz.style.width = luz.style.height = "0";
  }

  fechadura.classList.toggle("sobre", dist < 80);
  chaveWrap.classList.toggle("perto", dist < 110);
}

function aoSoltar() {
  if (!arrastando) return;
  arrastando = false;
  chaveWrap.classList.remove("segurando", "perto");
  fechadura.classList.remove("sobre");

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  if (dist < 85) {
    encaixar(cf);
  } else {
    voltarChave();
    apagarLuz();
  }
}

function voltarChave() {
  chaveWrap.style.transition = "transform 0.5s cubic-bezier(.4,0,.2,1)";
  dx = 0; dy = 0;
  chaveWrap.style.transform = "translate(0,0)";
  setTimeout(() => { chaveWrap.style.transition = ""; }, 520);
}

function apagarLuz() {
  luz.style.opacity = "0";
  luz.style.width = luz.style.height = "0";
}

function encaixar(cf) {
  desbloqueado = true;
  instrucao.style.opacity = "0";

  /* Snap suave para o centro da fechadura */
  const cr = chaveWrap.getBoundingClientRect();
  chaveWrap.style.transition = "left 0.4s cubic-bezier(.4,0,.2,1), top 0.4s cubic-bezier(.4,0,.2,1), transform 0.4s";
  chaveWrap.style.left = (cf.x - cr.width/2)  + "px";
  chaveWrap.style.top  = (cf.y - cr.height/2) + "px";
  chaveWrap.style.transform = "translate(0,0)";
  dx = 0; dy = 0;

  /* Luz máxima */
  luz.style.opacity = "0.95";
  luz.style.width = luz.style.height = "300px";

  setTimeout(() => {
    chaveWrap.style.transition = "";
    chaveWrap.classList.remove("perto");
    chaveWrap.classList.add("encaixando");

    /* Som de destrancar no início do giro */
    setTimeout(() => tocarSom(), 350);

    /* Flash 1 */
    setTimeout(() => {
      fazFlash();
      spawnarParticulas(cf, 22);
      porta.classList.add("abrindo");
    }, 950);

    /* Flash 2 — reforço */
    setTimeout(() => {
      fazFlash();
      spawnarParticulas(cf, 16);
    }, 1200);

    /* Tela de sucesso */
    setTimeout(() => {
      apagarLuz();
      sucesso.classList.add("visivel");
      iniciarContagem(5);
    }, 2400);
  }, 430);
}

function fazFlash() {
  flash.classList.add("ativo");
  setTimeout(() => flash.classList.remove("ativo"), 160);
}

function spawnarParticulas(c, qtd) {
  const cores = [
    "#d4af37","#f5d0c0","#fff5d0",
    "#e8b070","#ffd700","#f0b0c8",
    "#ffe8e0","#d4a060","#ffffff","#ffcce8"
  ];
  for (let i = 0; i < qtd; i++) {
    const el  = document.createElement("div");
    el.className = "particula";
    const tam  = 4 + Math.random() * 12;
    const ang  = Math.random() * Math.PI * 2;
    const vel  = 55 + Math.random() * 140;
    const tx   = (Math.cos(ang) * vel).toFixed(1);
    const ty   = (Math.sin(ang) * vel - 60).toFixed(1);
    const dur  = (1.1 + Math.random() * 1.0).toFixed(2);
    const del  = (Math.random() * 0.28).toFixed(2);
    el.style.cssText = `
      width:${tam}px;height:${tam}px;
      background:${cores[Math.floor(Math.random()*cores.length)]};
      left:${c.x+(Math.random()-0.5)*50}px;
      top:${c.y+(Math.random()-0.5)*40}px;
      --tx:${tx}px;--ty:${ty}px;
      --dur:${dur}s;--delay:${del}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }
}

let timer;
function iniciarContagem(seg) {
  contagem.textContent = `Abrindo em ${seg}s...`;
  timer = setInterval(() => {
    seg--;
    if (seg <= 0) { clearInterval(timer); irParaLink(); }
    else contagem.textContent = `Abrindo em ${seg}s...`;
  }, 1000);
}

function irParaLink() {
  clearInterval(timer);
  window.location.href = LINK;
}
</script>
</body>
</html>
