<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Convite - Laura Cecília XV Anos</title>

<!-- Preview WhatsApp / redes sociais -->
<meta property="og:title" content="🗝️ Você tem um convite especial!" />
<meta property="og:description" content="Leve a chave até a fechadura e descubra o convite de Laura Cecília" />
<meta property="og:image" content="preview.jpg" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="preview.jpg" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a0a0f;
    touch-action: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Porta (fundo) — ocupa a tela inteira */
  #porta {
    position: absolute;
    inset: 0;
    background: url('porta.png') center center / cover no-repeat;
  }

  /* Chave arrastável */
  #chave {
    position: fixed;
    width: clamp(90px, 18vw, 150px);
    cursor: grab;
    touch-action: none;
    user-select: none;
    z-index: 20;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
    transition: filter 0.2s;
    /* Posição inicial: canto inferior direito */
    bottom: 80px;
    right: 30px;
    top: auto;
    left: auto;
  }
  #chave img {
    width: 100%;
    height: auto;
    display: block;
    transform-origin: 50% 30%; /* ponto de giro = topo da chave (cabo) */
    transition: transform 0.2s;
  }
  #chave.girando img {
    animation: girarChave 1.1s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes girarChave {
    0%   { transform: rotate(0deg); }
    20%  { transform: rotate(-15deg); }
    65%  { transform: rotate(120deg); }
    100% { transform: rotate(100deg); }
  }

  /* Zona alvo da fechadura — posicionada sobre o buraco da porta */
  #fechadura {
    position: absolute;
    /* Fechadura está aproximadamente no centro-vertical e levemente à esquerda */
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 90px;
    z-index: 10;
    border-radius: 4px;
    /* descomente para calibrar: border: 2px dashed red; */
  }
  #fechadura.sobre {
    background: radial-gradient(ellipse, rgba(212,175,55,0.2) 0%, transparent 70%);
  }

  /* Texto de instrução */
  #instrucao {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #f5e0c8;
    font-family: 'Georgia', serif;
    font-size: clamp(13px, 3.8vw, 17px);
    letter-spacing: 0.07em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.85);
    white-space: nowrap;
    pointer-events: none;
    z-index: 30;
    animation: piscar 2.5s ease-in-out infinite;
    transition: opacity 0.5s;
  }
  @keyframes piscar {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Flash dourado ao encaixar */
  #flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.12s;
    background: radial-gradient(ellipse at 50% 44%, rgba(255,230,150,0.65) 0%, transparent 65%);
  }
  #flash.ativo { opacity: 1; }

  /* Tela de sucesso */
  #sucesso {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    background: rgba(20, 5, 12, 0.75);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #sucesso.visivel {
    opacity: 1;
    pointer-events: all;
  }
  #sucesso-titulo {
    color: #f5e0c8;
    font-family: 'Georgia', serif;
    font-size: clamp(18px, 5vw, 28px);
    letter-spacing: 0.1em;
    text-align: center;
    padding: 0 2rem;
    text-shadow: 0 0 30px rgba(212,150,150,0.5);
  }
  #sucesso-sub {
    color: #d4a0b0;
    font-family: 'Georgia', serif;
    font-size: clamp(13px, 3vw, 15px);
    letter-spacing: 0.06em;
    text-align: center;
  }
  #btn-abrir {
    margin-top: 0.5rem;
    padding: 14px 44px;
    background: transparent;
    border: 1.5px solid #d4af37;
    border-radius: 40px;
    color: #f5e0c8;
    font-family: 'Georgia', serif;
    font-size: clamp(14px, 3.5vw, 17px);
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  #btn-abrir:hover {
    background: rgba(212,175,55,0.15);
    box-shadow: 0 0 24px rgba(212,175,55,0.35);
  }

  /* Partículas */
  .particula {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 45;
    animation: subirPartícula 1.5s ease-out forwards;
  }
  @keyframes subirPartícula {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(0.2); }
  }
</style>
</head>
<body>

<div id="scene">
  <div id="porta"></div>
  <div id="flash"></div>
  <div id="fechadura"></div>

  <div id="chave">
    <img src="chave.png" alt="Chave ornamental" draggable="false" id="chave-img"/>
  </div>

  <p id="instrucao">Leve a chave até a fechadura</p>

  <div id="sucesso">
    <p id="sucesso-titulo">✨ A porta se abriu ✨</p>
    <p id="sucesso-sub">Seu convite está esperando por você</p>
    <button id="btn-abrir" onclick="irParaLink()">Abrir convite</button>
  </div>
</div>

<script>
  const LINK = "https://convite-digital.com/c/lauracecilia";

  const chave     = document.getElementById("chave");
  const chaveImg  = document.getElementById("chave-img");
  const fechadura = document.getElementById("fechadura");
  const instrucao = document.getElementById("instrucao");
  const flash     = document.getElementById("flash");
  const sucesso   = document.getElementById("sucesso");

  let arrastando = false;
  let inicioX, inicioY, deslocX = 0, deslocY = 0;
  let desbloqueado = false;
  let posFixaIniciada = false;

  /* Converte posição inicial para fixed */
  function iniciarPosicao() {
    const r = chave.getBoundingClientRect();
    chave.style.bottom = "auto";
    chave.style.right  = "auto";
    chave.style.left   = r.left + "px";
    chave.style.top    = r.top  + "px";
    posFixaIniciada = true;
  }

  function centroDa(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ---- Eventos ---- */
  chave.addEventListener("mousedown",  iniciarArraste);
  chave.addEventListener("touchstart", iniciarArraste, { passive: false });
  window.addEventListener("mousemove",  moverArraste);
  window.addEventListener("touchmove",  moverArraste, { passive: false });
  window.addEventListener("mouseup",    soltarArraste);
  window.addEventListener("touchend",   soltarArraste);

  function iniciarArraste(e) {
    if (desbloqueado) return;
    e.preventDefault();
    if (!posFixaIniciada) iniciarPosicao();
    arrastando = true;
    chave.style.cursor = "grabbing";
    const p = e.touches ? e.touches[0] : e;
    inicioX = p.clientX - deslocX;
    inicioY = p.clientY - deslocY;
  }

  function moverArraste(e) {
    if (!arrastando) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    deslocX = p.clientX - inicioX;
    deslocY = p.clientY - inicioY;
    chave.style.transform = `translate(${deslocX}px, ${deslocY}px)`;

    /* Destaque quando perto da fechadura */
    const ck = centroDa(chave);
    const cf = centroDa(fechadura);
    const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);
    fechadura.classList.toggle("sobre", dist < 60);
  }

  function soltarArraste(e) {
    if (!arrastando) return;
    arrastando = false;
    chave.style.cursor = "grab";
    fechadura.classList.remove("sobre");

    const ck = centroDa(chave);
    const cf = centroDa(fechadura);
    const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

    if (dist < 65) {
      encaixarEDesbloquear(cf);
    } else {
      voltarChave();
    }
  }

  function voltarChave() {
    chave.style.transition = "transform 0.45s cubic-bezier(.4,0,.2,1)";
    deslocX = 0; deslocY = 0;
    chave.style.transform = "translate(0px, 0px)";
    setTimeout(() => chave.style.transition = "", 460);
  }

  function encaixarEDesbloquear(cf) {
    desbloqueado = true;
    instrucao.style.opacity = "0";

    /* Move chave para centro da fechadura */
    const ck = centroDa(chave);
    const chaveRect = chave.getBoundingClientRect();
    const novoLeft = cf.x - chaveRect.width  / 2;
    const novoTop  = cf.y - chaveRect.height / 2;

    chave.style.transition = "left 0.3s ease, top 0.3s ease, transform 0.3s ease";
    chave.style.left      = novoLeft + "px";
    chave.style.top       = novoTop  + "px";
    chave.style.transform = "translate(0,0)";
    deslocX = 0; deslocY = 0;

    /* Gira a chave */
    setTimeout(() => {
      chave.classList.add("girando");

      /* Flash de luz */
      setTimeout(() => {
        flash.classList.add("ativo");
        spawnarParticulas(cf);
        setTimeout(() => flash.classList.remove("ativo"), 280);
      }, 750);

      /* Tela de sucesso */
      setTimeout(() => {
        sucesso.classList.add("visivel");
        setTimeout(irParaLink, 4000);
      }, 1400);

    }, 320);
  }

  function spawnarParticulas(centro) {
    const cores = ["#d4af37","#f5c8d0","#fff8e1","#c9734a","#ffd700","#f0a0b8"];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement("div");
      p.className = "particula";
      const tam = 4 + Math.random() * 8;
      p.style.cssText = `
        width:${tam}px; height:${tam}px;
        background:${cores[Math.floor(Math.random() * cores.length)]};
        left:${centro.x + (Math.random() - 0.5) * 70}px;
        top:${centro.y  + (Math.random() - 0.5) * 50}px;
        animation-delay:${Math.random() * 0.35}s;
        animation-duration:${1.1 + Math.random() * 0.7}s;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  function irParaLink() {
    window.location.href = LINK;
  }
</script>
</body>
</html>
