<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Convite - Laura Cecília XV Anos</title>
<meta property="og:title" content="🗝️ Você tem um convite especial!" />
<meta property="og:description" content="Leve a chave até a fechadura e descubra o convite de Laura Cecília" />
<meta property="og:image" content="preview.jpg" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="preview.jpg" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:#0d0608;
  font-family:'Georgia',serif;
  touch-action:none;
}

/* ── CENA ── */
#scene {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Porta em tela cheia */
#porta {
  position:absolute;
  inset:0;
  background: url('porta.png') center center / cover no-repeat;
  transition: filter 1.2s ease;
}
#porta.abrindo {
  filter: brightness(1.35) saturate(1.2);
}

/* Vinheta cinematográfica */
#vinheta {
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at center,
    transparent 40%,
    rgba(0,0,0,0.55) 100%);
  pointer-events:none;
  z-index:2;
}

/* ── CHAVE ── */
#chave-wrap {
  position:fixed;
  /* Posição inicial: centro-baixo da tela */
  left: 50%;
  bottom: 60px;
  transform: translateX(-50%);
  width: clamp(160px, 38vw, 260px);
  cursor: grab;
  touch-action: none;
  user-select: none;
  z-index: 20;
  filter:
    drop-shadow(0 0 18px rgba(212,155,90,0.5))
    drop-shadow(0 8px 24px rgba(0,0,0,0.7));
  transition: filter 0.3s;
  will-change: transform;
}
#chave-wrap:active { cursor:grabbing; }
#chave-wrap.segurando {
  filter:
    drop-shadow(0 0 28px rgba(255,200,100,0.7))
    drop-shadow(0 12px 32px rgba(0,0,0,0.8));
}

#chave-img {
  width:100%;
  height:auto;
  display:block;
  /* A chave está inclinada ~45° na imagem original — normalizamos */
  transform: rotate(-45deg);
  transform-origin: 50% 50%;
  transition: transform 0.3s ease;
}

/* Quando próxima da fechadura — endireita levemente */
#chave-wrap.perto #chave-img {
  transform: rotate(-10deg);
  transition: transform 0.4s cubic-bezier(.4,0,.2,1);
}

/* Animação de encaixe + giro */
#chave-wrap.encaixando #chave-img {
  animation: encaixarGirar 1.4s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes encaixarGirar {
  0%   { transform: rotate(-10deg) scale(0.85); }
  25%  { transform: rotate(0deg)   scale(0.75); }
  50%  { transform: rotate(-20deg) scale(0.72); }
  80%  { transform: rotate(110deg) scale(0.72); }
  100% { transform: rotate(90deg)  scale(0.72); }
}

/* ── ZONA DA FECHADURA ── */
/* Posição calibrada para o buraco da porta.png (720x1280)
   Buraco fica em ~50% X, ~42% Y da imagem */
#fechadura {
  position:absolute;
  left:  50%;
  top:   42%;
  transform: translate(-50%, -50%);
  width:  80px;
  height: 100px;
  z-index:10;
  border-radius: 40px 40px 6px 6px;
  transition: box-shadow 0.3s;
  /* descomente para calibrar: border: 3px dashed red; */
}
#fechadura.sobre {
  box-shadow: 0 0 0 4px rgba(255,215,100,0.35),
              0 0 30px rgba(255,215,100,0.25);
}

/* ── INSTRUÇÃO ── */
#instrucao {
  position:fixed;
  bottom: 22px;
  left:50%;
  transform: translateX(-50%);
  color: #f5e0c8;
  font-size: clamp(13px, 3.5vw, 16px);
  letter-spacing: 0.08em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.9);
  white-space: nowrap;
  pointer-events:none;
  z-index:30;
  animation: piscar 2.8s ease-in-out infinite;
  transition: opacity 0.6s;
}
@keyframes piscar {
  0%,100% { opacity:0.5; }
  50%      { opacity:1;   }
}

/* ── LUZ DA FECHADURA ── */
#luz-fechadura {
  position:absolute;
  left:  50%;
  top:   42%;
  transform: translate(-50%, -50%);
  width: 0;
  height:0;
  border-radius:50%;
  background: radial-gradient(circle,
    rgba(255,240,180,0.9) 0%,
    rgba(255,180,80,0.4) 40%,
    transparent 70%);
  pointer-events:none;
  z-index:15;
  opacity:0;
  transition: width 0.8s ease, height 0.8s ease, opacity 0.8s ease;
}
#luz-fechadura.ativa {
  width:  300px;
  height: 300px;
  opacity:1;
}

/* ── FLASH ── */
#flash {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:40;
  opacity:0;
  background: radial-gradient(ellipse at 50% 42%,
    rgba(255,245,200,0.8) 0%,
    rgba(255,200,100,0.3) 40%,
    transparent 70%);
  transition: opacity 0.1s;
}
#flash.ativo { opacity:1; }

/* ── PARTÍCULAS ── */
.particula {
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:45;
  animation: voarParticula var(--dur, 1.4s) ease-out forwards;
}
@keyframes voarParticula {
  0%   { opacity:1; transform: translate(0,0) scale(1); }
  100% { opacity:0; transform: translate(var(--tx,0px), var(--ty,-100px)) scale(0.1); }
}

/* ── TELA DE SUCESSO ── */
#sucesso {
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.4rem;
  background: rgba(10,3,8,0.0);
  backdrop-filter: blur(0px);
  opacity:0;
  pointer-events:none;
  transition: opacity 1.2s ease, backdrop-filter 1.2s ease, background 1.2s ease;
}
#sucesso.visivel {
  opacity:1;
  pointer-events:all;
  background: rgba(10,3,8,0.72);
  backdrop-filter: blur(10px);
}

.sucesso-linha {
  display:flex;
  align-items:center;
  gap:0.5rem;
}
#sucesso-titulo {
  color:#f5e0c8;
  font-size: clamp(20px, 5.5vw, 32px);
  letter-spacing:0.12em;
  text-align:center;
  padding:0 2rem;
  text-shadow: 0 0 40px rgba(212,155,90,0.6);
  line-height:1.4;
}
#sucesso-sub {
  color:#d4a0b0;
  font-size: clamp(13px, 3.2vw, 15px);
  letter-spacing:0.07em;
  text-align:center;
}
.divisor {
  width:120px;
  height:1px;
  background: linear-gradient(to right, transparent, #d4af37, transparent);
  opacity:0.7;
}
#btn-abrir {
  margin-top:0.4rem;
  padding:16px 52px;
  background:transparent;
  border:1.5px solid rgba(212,175,55,0.8);
  border-radius:50px;
  color:#f5e0c8;
  font-family:'Georgia',serif;
  font-size: clamp(14px, 3.8vw, 18px);
  letter-spacing:0.15em;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition: color 0.3s, border-color 0.3s, box-shadow 0.3s;
}
#btn-abrir::before {
  content:'';
  position:absolute;
  inset:0;
  background: rgba(212,175,55,0.0);
  transition: background 0.3s;
}
#btn-abrir:hover {
  border-color:#d4af37;
  box-shadow: 0 0 30px rgba(212,175,55,0.3), inset 0 0 20px rgba(212,175,55,0.08);
}
#btn-abrir:hover::before {
  background: rgba(212,175,55,0.1);
}

/* Contador regressivo */
#countdown {
  color:rgba(212,160,176,0.6);
  font-size:12px;
  letter-spacing:0.1em;
}
</style>
</head>
<body>

<div id="scene">
  <div id="porta"></div>
  <div id="vinheta"></div>
  <div id="luz-fechadura"></div>
  <div id="flash"></div>
  <div id="fechadura"></div>

  <div id="chave-wrap">
    <img src="chave.png" id="chave-img" alt="Chave" draggable="false"/>
  </div>

  <p id="instrucao">✦ Leve a chave até a fechadura ✦</p>

  <div id="sucesso">
    <p id="sucesso-titulo">✨ A porta se abriu ✨</p>
    <div class="divisor"></div>
    <p id="sucesso-sub">Seu convite está esperando por você</p>
    <button id="btn-abrir" onclick="irParaLink()">Abrir convite</button>
    <p id="countdown"></p>
  </div>
</div>

<script>
const LINK = "https://convite-digital.com/c/lauracecilia";

const chaveWrap  = document.getElementById("chave-wrap");
const chaveImg   = document.getElementById("chave-img");
const fechadura  = document.getElementById("fechadura");
const instrucao  = document.getElementById("instrucao");
const flash      = document.getElementById("flash");
const sucesso    = document.getElementById("sucesso");
const porta      = document.getElementById("porta");
const luzFech    = document.getElementById("luz-fechadura");
const countdown  = document.getElementById("countdown");

let arrastando   = false;
let desbloqueado = false;
let posIniciada  = false;
let dx = 0, dy = 0;
let startX, startY;

/* ── Inicia posição fixed quando começa a arrastar ── */
function iniciarPos() {
  if (posIniciada) return;
  const r = chaveWrap.getBoundingClientRect();
  chaveWrap.style.bottom = "auto";
  chaveWrap.style.left   = r.left + "px";
  chaveWrap.style.top    = r.top  + "px";
  chaveWrap.style.transform = "none";
  posIniciada = true;
}

function centro(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ── Eventos de arraste ── */
chaveWrap.addEventListener("mousedown",  aoPresionar);
chaveWrap.addEventListener("touchstart", aoPresionar, { passive:false });
window.addEventListener("mousemove",  aoMover);
window.addEventListener("touchmove",  aoMover, { passive:false });
window.addEventListener("mouseup",    aoSoltar);
window.addEventListener("touchend",   aoSoltar);

function aoPresionar(e) {
  if (desbloqueado) return;
  e.preventDefault();
  iniciarPos();
  arrastando = true;
  chaveWrap.classList.add("segurando");
  const p = e.touches ? e.touches[0] : e;
  startX = p.clientX - dx;
  startY = p.clientY - dy;
}

function aoMover(e) {
  if (!arrastando) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  dx = p.clientX - startX;
  dy = p.clientY - startY;
  chaveWrap.style.transform = `translate(${dx}px, ${dy}px)`;

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  fechadura.classList.toggle("sobre", dist < 70);
  chaveWrap.classList.toggle("perto", dist < 90);

  /* Luz da fechadura aumenta conforme aproxima */
  if (dist < 180) {
    const intensidade = Math.max(0, 1 - dist / 180);
    luzFech.style.opacity = intensidade * 0.8;
    luzFech.style.width   = (intensidade * 280) + "px";
    luzFech.style.height  = (intensidade * 280) + "px";
  } else {
    luzFech.style.opacity = 0;
    luzFech.style.width   = "0";
    luzFech.style.height  = "0";
  }
}

function aoSoltar() {
  if (!arrastando) return;
  arrastando = false;
  chaveWrap.classList.remove("segurando","perto");
  fechadura.classList.remove("sobre");

  const ck = centro(chaveWrap);
  const cf = centro(fechadura);
  const dist = Math.hypot(ck.x - cf.x, ck.y - cf.y);

  if (dist < 75) {
    encaixar(cf);
  } else {
    voltarChave();
    luzFech.style.opacity = 0;
    luzFech.style.width   = "0";
    luzFech.style.height  = "0";
  }
}

function voltarChave() {
  chaveWrap.style.transition = "transform 0.5s cubic-bezier(.4,0,.2,1)";
  dx = 0; dy = 0;
  chaveWrap.style.transform = "translate(0,0)";
  setTimeout(() => chaveWrap.style.transition = "", 520);
}

function encaixar(cf) {
  desbloqueado = true;
  instrucao.style.opacity = "0";

  /* Move chave para centro exato da fechadura */
  const cr  = chaveWrap.getBoundingClientRect();
  const novoL = cf.x - cr.width  / 2;
  const novoT = cf.y - cr.height / 2;

  chaveWrap.style.transition = "left 0.4s cubic-bezier(.4,0,.2,1), top 0.4s cubic-bezier(.4,0,.2,1), transform 0.4s";
  chaveWrap.style.left      = novoL + "px";
  chaveWrap.style.top       = novoT + "px";
  chaveWrap.style.transform = "translate(0,0)";
  dx = 0; dy = 0;

  /* 1. Luz máxima na fechadura */
  luzFech.classList.add("ativa");

  /* 2. Animação de giro da chave */
  setTimeout(() => {
    chaveWrap.style.transition = "";
    chaveWrap.classList.add("encaixando");

    /* 3. Flash + partículas no pico do giro */
    setTimeout(() => {
      flash.classList.add("ativo");
      spawnarParticulas(cf);
      porta.classList.add("abrindo");
      setTimeout(() => flash.classList.remove("ativo"), 220);

      /* 4. Segundo flash */
      setTimeout(() => {
        flash.classList.add("ativo");
        setTimeout(() => flash.classList.remove("ativo"), 150);
      }, 300);

    }, 900);

    /* 5. Tela de sucesso */
    setTimeout(() => {
      luzFech.style.opacity = 0;
      sucesso.classList.add("visivel");
      iniciarContagem();
    }, 1800);

  }, 420);
}

function spawnarParticulas(centro) {
  const cores = [
    "#d4af37","#f5c8d0","#fff8e1",
    "#c9734a","#ffd700","#f0a0b8",
    "#ffe4e1","#d4855a","#ffffff"
  ];
  for (let i = 0; i < 35; i++) {
    const p = document.createElement("div");
    p.className = "particula";
    const tam = 3 + Math.random() * 10;
    const ang = Math.random() * Math.PI * 2;
    const vel = 60 + Math.random() * 120;
    const tx  = Math.cos(ang) * vel;
    const ty  = Math.sin(ang) * vel - 40;
    const dur = (1.0 + Math.random() * 0.8).toFixed(2);
    p.style.cssText = `
      width:${tam}px; height:${tam}px;
      background:${cores[Math.floor(Math.random()*cores.length)]};
      left:${centro.x + (Math.random()-0.5)*30}px;
      top:${centro.y  + (Math.random()-0.5)*20}px;
      --tx:${tx}px; --ty:${ty}px; --dur:${dur}s;
      animation-delay:${(Math.random()*0.25).toFixed(2)}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 2500);
  }
}

let contagem = 5;
function iniciarContagem() {
  countdown.textContent = `Abrindo em ${contagem}s...`;
  const timer = setInterval(() => {
    contagem--;
    if (contagem <= 0) {
      clearInterval(timer);
      irParaLink();
    } else {
      countdown.textContent = `Abrindo em ${contagem}s...`;
    }
  }, 1000);
}

function irParaLink() {
  window.location.href = LINK;
}
</script>
</body>
</html>
